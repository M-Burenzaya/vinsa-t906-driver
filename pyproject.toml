[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vinsa-t906"
version = "0.1.0"
description = "Evidence-backed reconstruction of Vinsa tablet configuration and HID feature reports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
vinsa-t906 = "vinsa_t906.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
